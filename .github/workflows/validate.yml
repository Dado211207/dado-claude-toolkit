name: Validate

# Structural validation of the marketplace, plugins, profiles and documentation.
# This workflow reads the repository and runs a standard-library Python script.
# It requires no secrets, publishes nothing, deploys nothing, and opens, merges or
# closes no pull request.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Structural validation (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Report the environment
        run: |
          python3 --version
          git --version

      - name: Validation run 1 of 2
        run: python3 tests/run_validation.py

      - name: Validation run 2 of 2
        run: python3 tests/run_validation.py

      - name: Official Claude Code plugin validator
        # Reported honestly: this step states whether the official validator actually
        # ran. When the CLI is not present on the runner it is recorded as SKIPPED,
        # never as passed, and the job does not fail because of its absence.
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo "claude CLI found: $(claude --version)"
            claude plugin validate .
          else
            echo "SKIPPED: the claude CLI is not installed on this runner."
            echo "The official plugin validator did NOT run. This is not a pass."
            echo "The structural suite above is not a substitute for it."
          fi

      - name: Confirm the checkout is clean
        # Nothing above may modify the working tree. If anything did, a check has a
        # side effect it should not have.
        run: |
          if [ -n "$(git status --porcelain=v1)" ]; then
            echo "The working tree was modified by the validation run:"
            git status --porcelain=v1
            exit 1
          fi
          echo "Working tree clean."
